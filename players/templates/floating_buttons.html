{% comment %} CHANGE TAB {% endcomment %}
{% if role == "DM" or role == "PA" %}
    <button class="btn btn-success rounded-circle position-fixed"
            style="bottom: 80px;
                   right: 20px;
                   z-index: 1050"
            type="button"
            id="switch-tab-btn">
        <i class="bi bi-arrow-repeat"></i>
    </button>
    <script>
document.getElementById('switch-tab-btn').addEventListener('click', function() {
    // Find whichever tab nav is visible
    let activeTab = document.querySelector('.nav-link.active');

    if (!activeTab) return; // no tab active, bail

    let targetId = activeTab.getAttribute('id');

    // Logic for Characters/Add Characters
    if (targetId === 'characters-tab') {
        new bootstrap.Tab(document.getElementById('add-characters-tab')).show();
    } else if (targetId === 'add-characters-tab') {
        new bootstrap.Tab(document.getElementById('characters-tab')).show();
    }

    // Logic for Lobbies
    else if (targetId === 'my-lobbies-tab') {
        new bootstrap.Tab(document.getElementById('other-lobbies-tab')).show();
    } else if (targetId === 'other-lobbies-tab') {
        new bootstrap.Tab(document.getElementById('my-lobbies-tab')).show();
    }
});
    </script>
{% endif %}
{% comment %} SIDE MENU {% endcomment %}
<button class="btn btn-primary rounded-circle position-fixed"
        style="bottom: 20px;
               right: 20px;
               z-index: 1050"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#sideMenu"
        aria-controls="sideMenu">
    <i class="bi bi-list"></i>
</button>
<div class="offcanvas offcanvas-end"
     tabindex="-1"
     id="sideMenu"
     aria-labelledby="sideMenuLabel">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="sideMenuLabel">Options</h5>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="offcanvas"
                aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <ul class="list-group">
            <li class="list-group-item">{% include "players/partials/side_menu/to_lobbies.html" %}</li>
            <li class="list-group-item">{% include "players/partials/side_menu/dark_mode_toggle.html" %}</li>
        </ul>
    </div>
</div>
