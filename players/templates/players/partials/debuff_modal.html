{% block content %}
  <div class="modal fade"
       id="debuffCharacterModal"
       tabindex="-1"
       aria-labelledby="debuffModal"
       aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editLobbyModalLabel">Debuff {{ character }}</h5>
          <button type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"></button>
        </div>
        <form hx-post="{% url 'debuff_character' %}"
              hx-swap="innerHTML"
              id="debuffCharacterForm"
              hx-target="#character-list">
          <div class="modal-body">
            {% csrf_token %}
            <input type="hidden" name="player_lobby_id" value="{{ player.id }}">
            <input type="hidden" name="character_id" value="{{ character.id }}">
            <input type="hidden" name="action" id="action" value="">
            <input type="text"
                   id="debuff"
                   name="debuff"
                   class="form-control"
                   value="{{ character.debuff|default:'' }}"
                   placeholder="Enter debuff (optional)" />
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            {% if character.debuff %}
              <button type="button"
                      class="btn btn-danger"
                      onclick="setDebuffAction(event, 'remove')">Remove</button>
            {% endif %}
            <button type="button"
                    class="btn btn-primary"
                    onclick="setDebuffAction(event, 'add_edit')">
              {% if character.debuff %}
                Edit
              {% else %}
                Add
              {% endif %}
            </button>
            <button type="submit" hidden id="submitBtn"></button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script>
    var myModal = new bootstrap.Modal(document.getElementById('debuffCharacterModal'));
    myModal.show();
    document.body.addEventListener("htmx:configRequest", (event) => {
        var token = document.querySelector("meta[name='csrf-token']").getAttribute("content");
        event.detail.headers["X-CSRFToken"] = token;
    });

    document.getElementById('debuffCharacterModal').addEventListener('shown.bs.modal', function () {
      const input = document.querySelector('#debuff');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length); // Move cursor to end
      }
    });
    

    function setDebuffAction(event, actionType) {
      event.preventDefault(); // Prevent the default form submission
      const form = document.getElementById('debuffCharacterForm');
      const actionInput = form.querySelector('input[name="action"]');
      const debuffInput = form.querySelector('input[name="debuff"]');
    
      if (actionType === 'remove') {
        actionInput.value = 'delete';
        debuffInput.value = '';
      } else if (actionType === 'add_edit') {
        const userInput = debuffInput.value.trim();
        actionInput.value = 'add_edit';
        debuffInput.value = userInput || 'Debuffed';
      }
      htmx.trigger(form, 'submit');
      myModal.hide();
    }

  </script>
{% endblock content %}
