{% if player_lobby.lobby %}
  <h2>
    {{ player_lobby.player }}
    <button class="btn btn-sm btn-info edit-character open-modal"
            data-modal-id="editPlayerModal"
            hx-get="{% url 'load_player_edit_modal' player_lobby.player.id player_lobby.lobby.id %}"
            hx-target="#player-modal-container"
            hx-swap="innerHTML">
      <i class="bi bi-pencil"></i>
      <span class="tooltip-text tooltip-bottom">Edit Player</span>
    </button>
  </h2>
{% else %}
  <h2>
    {{ player }}
    <button class="btn btn-sm btn-info edit-character open-modal"
            data-modal-id="editPlayerModal"
            hx-get="{% url 'load_player_edit_modal' player.id 0 %}"
            hx-target="#player-modal-container"
            hx-swap="innerHTML">
      <i class="bi bi-pencil"></i>
      <span class="tooltip-text tooltip-bottom">Edit Player</span>
    </button>
  </h2>
{% endif %}
