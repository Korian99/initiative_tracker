<label for="{{ select_id }}">Choose a Stat Block:</label>
<select id="{{ select_id }}" name="stat_block" class="form-select">
  <option value="">None</option>
  {% for creature in creatures %}
    <option value="{{ creature.name }}"
            {% if creature.name == default_value %}selected{% endif %}>
      {{ creature.name }} (Level {{ creature.level }})
    </option>
  {% endfor %}
</select>
