<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>
      {% block title %}
        My Lobby App
      {% endblock title %}
    </title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
    html, body {
      height: 100%;
    }
    .full-height {
      height: 100%;
    }
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    
    /* Track */
    ::-webkit-scrollbar-track {
        -webkit-box-shadow: inset 0 0 2px rgba(0,0,0,0.3); 
        -webkit-border-radius: 2px;
        border-radius: 10px;
    }
    
    /* Handle */
    ::-webkit-scrollbar-thumb {
        -webkit-border-radius: 10px;
        border-radius: 10px;
        background: lightgray; 
        -webkit-box-shadow: inset 0 0 6px rgba(0,0,0,0.5); 
    }
    ::-webkit-scrollbar-thumb:window-inactive {
        background: gray; 
    }
    .select2-container--default .select2-selection--single {
      border: 1px solid #ced4da!important;
    }
    .select2-dropdown {
      z-index: 2000 !important;
    }

    </style>
    <!-- HTMX library -->
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
    <!-- Bootstrap JS Bundle (optional) -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
          <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
          
    <!-- before </body> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

  </head>
  <body>
    <div class="container full-height d-flex justify-content-center align-items-center flex-column">
      <div>
        {% block navbar %}
        {% endblock navbar %}
      </div>
      {% comment %} TODO CHANGE OVERFLOW BARRA {% endcomment %}
      <div class="d-flex card p-2 overflow-auto">
        <div class="row text-center">
          {% block player %}
          {% endblock player %}
        </div>
        <div class="row m-3">
          <div class="col d-flex flex-column justify-content-center align-items-center text-center">
            {% block content %}
            {% endblock content %}
          </div>
        </div>
      </div>
    </div>
    <script>
      function confirmClick(e)
      {
          if(!confirm('Are you sure?')) {
              e.preventDefault();
          }
      }
    </script>
    
    <script>
      function initCreatureSelect(ctx=document, id) {
        const $el = $(ctx).find(id);
        let dropdownParent = null;
        if (id === '#stat_block_edit'){
          dropdownParent = $('#editCharacterModal')
        }
        if ($el.length && !$el.data('select2')) {
          $el.select2({
            width: '100%',
            placeholder: 'Search for a Stat Block',
            allowClear: true,
            dropdownParent:dropdownParent
          });
        }
      }

      document.addEventListener('DOMContentLoaded', () => initCreatureSelect());
      document.body.addEventListener('htmx:afterSwap', (e) => {
        if (e.target && e.target.id === 'select_creature') {
          initCreatureSelect(e.target, "#stat_block_add");
        } else if (e.target && e.target.id === 'edit_creature'){
          initCreatureSelect(e.target, "#stat_block_edit");
        }
      });
    </script>
  </body>
</html>
